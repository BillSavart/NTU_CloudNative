name: CD

# Runs only after the CI workflow succeeds on main, then builds the four
# application images, pushes them to GHCR, and deploys them onto the GCP VM
# over SSH. Infra images (Postgres / Redis / Kafka / observability) are pulled
# straight from their upstream registries by docker compose on the VM.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    # Skip if CI failed. workflow_dispatch has no workflow_run payload, so the
    # conclusion check is short-circuited for manual runs.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [access-api, reporting-api, frontend, simulator]
    steps:
      - uses: actions/checkout@v4
        with:
          # On workflow_run, default checkout is the branch HEAD; pin to the
          # exact commit CI validated so image tags line up with the source.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on the VM over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Forward the image tag + GHCR pull creds into the remote shell so
          # scripts/deploy.sh can log in and pull the exact built images.
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            ./scripts/deploy.sh
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.DEPLOY_GHCR_TOKEN }}
