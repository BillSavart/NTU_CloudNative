name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test -- --run

  access-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: access-api
    services:
      # Real Redis so the decideAccessScript / appendEventOnceScript Lua tests
      # (TEST_REDIS_ADDR-gated) actually run, covering atomicity and TTLs that
      # the in-memory fakeStore cannot. No password: redis:7-alpine defaults to
      # no auth, and the tests connect without one when TEST_REDIS_PASSWORD is unset.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: access-api/go.sum
      - run: go test ./... -covermode=atomic -coverprofile=coverage.out
      # Print a per-function + total coverage summary as graded evidence.
      - run: go tool cover -func=coverage.out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: access-api-coverage
          path: access-api/coverage.out

  reporting-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reporting-api
    services:
      # Exercise the PostgreSQL-only SQL paths (FILTER, ::date casts, to_char,
      # MATERIALIZED CTEs) that the default SQLite backend silently skips.
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: access_control_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d access_control_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://root:postgres@127.0.0.1:5432/access_control_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Run the suite under coverage (TEST_DATABASE_URL routes it at PostgreSQL)
      # and emit a report as graded evidence plus an XML artifact.
      - run: coverage run -m unittest discover -s tests
      - run: coverage report -m
      - run: coverage xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporting-api-coverage
          path: reporting-api/coverage.xml
