services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  access-api:
    build:
      context: ./access-api
    restart: on-failure
    environment:
      PORT: "8080"
      REDIS_SENTINEL_ADDRS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_MASTER_NAME: mymaster
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_TOPIC: access-events
      PUBLISHER_ASYNC: "true"
      PUBLISHER_QUEUE_SIZE: "100000"
      PUBLISHER_WORKERS: "8"
      PUBLISHER_BATCH_SIZE: "100"
      PUBLISHER_FLUSH_MS: "10"
      PUBLISHER_RETRY_INITIAL_MS: "100"
      PUBLISHER_RETRY_MAX_MS: "5000"
      OTEL_SERVICE_NAME: access-api
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://alloy:4318/v1/traces
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      - redis-sentinel-1
      - redis-sentinel-2
      - redis-sentinel-3
      - kafka-1
      - kafka-2
      - kafka-3
      - alloy

  access-lb:
    image: nginx:1.27-alpine
    ports:
      - "${ACCESS_HOST_PORT:-8080}:8080"
    volumes:
      - ./infra/nginx/access-api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      access-api:
        condition: service_healthy

  reporting-api:
    build:
      context: ./reporting-api
    environment:
      APP_NAME: reporting-api
      APP_ENV: local
      APP_DEBUG: "true"
      APP_SECRET_KEY: ${APP_SECRET_KEY:-replace-with-a-long-random-secret}
      APP_COOKIE_SECURE: "false"
      DASHBOARD_CACHE_TTL_SECONDS: ${DASHBOARD_CACHE_TTL_SECONDS:-60}
      DEMO_SEED_PASSWORD: ${DEMO_SEED_PASSWORD:-demo123}
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_ACCESS_EVENTS_TOPIC: access-events
      KAFKA_CONSUMER_ENABLED: "true"
      KAFKA_CONSUMER_GROUP_ID: reporting-api
      KAFKA_AUTO_OFFSET_RESET: earliest
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      REDIS_DB: "0"
      REDIS_EVENT_STREAM_KEY: access:events
      REDIS_RECOVERY_ENABLED: "true"
      REDIS_RECOVERY_GROUP: reporting-api
      REDIS_RECOVERY_CONSUMER_NAME: reporting-api-1
      REDIS_RECOVERY_BLOCK_MS: "5000"
      REDIS_RECOVERY_BATCH_SIZE: "100"
      OTEL_SERVICE_NAME: reporting-api
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://alloy:4318/v1/traces
    ports:
      - "${REPORTING_HOST_PORT:-8000}:8000"
    depends_on:
      - db
      - kafka-1
      - kafka-2
      - kafka-3
      - alloy

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    depends_on:
      - reporting-api

  simulator:
    build:
      context: ./simulator
    ports:
      - "${SIMULATOR_HOST_PORT:-5174}:80"
    depends_on:
      access-api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.0.1
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheusdata:/prometheus
    depends_on:
      - access-lb

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - tempo

  loki:
    image: grafana/loki:3.3.2
    ports:
      - "${LOKI_HOST_PORT:-3100}:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - lokidata:/loki

  tempo:
    image: grafana/tempo:2.6.1
    ports:
      - "${TEMPO_HOST_PORT:-3200}:3200"
      - "${TEMPO_OTLP_GRPC_HOST_PORT:-4317}:4317"
      - "${TEMPO_OTLP_HTTP_HOST_PORT:-4318}:4318"
    command: -config.file=/etc/tempo/tempo-config.yaml
    volumes:
      - ./infra/tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempodata:/var/tempo

  alloy:
    image: grafana/alloy:v1.5.1
    ports:
      - "${ALLOY_OTLP_GRPC_HOST_PORT:-14317}:4317"
      - "${ALLOY_OTLP_HTTP_HOST_PORT:-14318}:4318"
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    depends_on:
      - loki
      - tempo

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: sh -c "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redisdata:/data

  redis-replica-1:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: sh -c "redis-server --replicaof redis 6379 --masterauth \"$$REDIS_PASSWORD\" --requirepass \"$$REDIS_PASSWORD\""
    depends_on:
      - redis

  redis-replica-2:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: sh -c "redis-server --replicaof redis 6379 --masterauth \"$$REDIS_PASSWORD\" --requirepass \"$$REDIS_PASSWORD\""
    depends_on:
      - redis

  redis-sentinel-1:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "${REDIS_SENTINEL_1_HOST_PORT:-26379}:26379"
    command: sh -c "cp /etc/redis/sentinel.conf /tmp/sentinel.conf && echo \"sentinel auth-pass mymaster $$REDIS_PASSWORD\" >> /tmp/sentinel.conf && redis-server /tmp/sentinel.conf --sentinel"
    volumes:
      - ./infra/redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      - redis
      - redis-replica-1
      - redis-replica-2

  redis-sentinel-2:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "${REDIS_SENTINEL_2_HOST_PORT:-26380}:26379"
    command: sh -c "cp /etc/redis/sentinel.conf /tmp/sentinel.conf && echo \"sentinel auth-pass mymaster $$REDIS_PASSWORD\" >> /tmp/sentinel.conf && redis-server /tmp/sentinel.conf --sentinel"
    volumes:
      - ./infra/redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      - redis
      - redis-replica-1
      - redis-replica-2

  redis-sentinel-3:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "${REDIS_SENTINEL_3_HOST_PORT:-26381}:26379"
    command: sh -c "cp /etc/redis/sentinel.conf /tmp/sentinel.conf && echo \"sentinel auth-pass mymaster $$REDIS_PASSWORD\" >> /tmp/sentinel.conf && redis-server /tmp/sentinel.conf --sentinel"
    volumes:
      - ./infra/redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      - redis
      - redis-replica-1
      - redis-replica-2

  kafka-1:
    image: apache/kafka:3.9.0
    ports:
      - "${KAFKA_1_HOST_PORT:-19092}:19092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:${KAFKA_1_HOST_PORT:-19092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka1data:/var/lib/kafka/data

  kafka-2:
    image: apache/kafka:3.9.0
    ports:
      - "${KAFKA_2_HOST_PORT:-29092}:29092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:${KAFKA_2_HOST_PORT:-29092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka2data:/var/lib/kafka/data

  kafka-3:
    image: apache/kafka:3.9.0
    ports:
      - "${KAFKA_3_HOST_PORT:-39092}:39092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:39092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:${KAFKA_3_HOST_PORT:-39092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka3data:/var/lib/kafka/data

volumes:
  pgdata:
  redisdata:
  kafka1data:
  kafka2data:
  kafka3data:
  prometheusdata:
  grafanadata:
  lokidata:
  tempodata:
