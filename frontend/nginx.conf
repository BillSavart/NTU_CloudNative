server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=1s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        set $reporting_api_upstream reporting-api:8000;
        proxy_pass http://$reporting_api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Heavy company-wide (executive) reports can take a while on a single
        # node; allow up to 180s instead of nginx's 60s default to avoid 504.
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
