# Docker's embedded DNS. `valid=10s` lets nginx pick up a new access-api
# container IP (restart / redeploy / scale) without a manual reload — the same
# dynamic re-resolution the old `set $var` + variable proxy_pass gave us.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream access_api {
    # Shared zone is required for the `resolve` parameter below.
    zone access_api 64k;
    # `resolve` (open-source nginx >= 1.27.3) re-resolves the name via the
    # resolver above, so we keep dynamic DNS *and* a real upstream block.
    server access-api:8080 resolve;

    # Connection pool to the upstream. Without this nginx opens a brand-new
    # TCP connection per request and closes it (Connection: close), so under
    # load thousands of sockets pile up in TIME_WAIT and exhaust the ephemeral
    # port range to access-api — which surfaces as "connection reset by peer"
    # on the client around ~1-2k req/s. Reusing connections removes that wall.
    keepalive 256;
}

server {
    listen 8080;

    location / {
        proxy_pass http://access_api;
        proxy_http_version 1.1;
        # Must be empty so nginx keeps the upstream connection alive instead of
        # sending `Connection: close` (which defeats the keepalive pool above).
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
