server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Strip leading slash from container name  (e.g. /ntu_cloudnative-access-api-1 → ntu_cloudnative-access-api-1)
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      # Structured label: compose service name (e.g. access-api, reporting-api)
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      # Structured label: compose project name
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: project
      # Log stream (stdout / stderr)
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
    pipeline_stages:
      # Parse Docker's JSON log wrapper so the raw message is extracted cleanly
      - docker: {}
