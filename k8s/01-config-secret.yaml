apiVersion: v1
kind: Secret
metadata:
  name: access-control-secrets
  namespace: access-control
type: Opaque
stringData:
  POSTGRES_PASSWORD: replace-with-a-strong-password
  REDIS_PASSWORD: replace-with-a-strong-password
  APP_SECRET_KEY: replace-with-a-long-random-secret
  GRAFANA_ADMIN_PASSWORD: replace-with-a-strong-password
  DEMO_SEED_PASSWORD: replace-with-a-demo-password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: access-control-config
  namespace: access-control
data:
  POSTGRES_DB: access_control
  POSTGRES_USER: root
  GRAFANA_ADMIN_USER: admin
  APP_COOKIE_SECURE: "true"
  KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
  KAFKA_TOPIC: access-events
  REDIS_ADDR: redis:6379
  REDIS_SENTINEL_ADDRS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
  REDIS_MASTER_NAME: mymaster
  CORS_ORIGINS: http://localhost:5173,http://frontend
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-sentinel-config
  namespace: access-control
data:
  sentinel.conf: |
    port 26379
    sentinel monitor mymaster redis 6379 2
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes
    sentinel down-after-milliseconds mymaster 5000
    sentinel failover-timeout mymaster 10000
    sentinel parallel-syncs mymaster 1
