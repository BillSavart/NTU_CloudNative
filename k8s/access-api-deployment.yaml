apiVersion: apps/v1
kind: Deployment
metadata:
  name: access-api
  namespace: access-control
  labels:
    app: access-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: access-api
  template:
    metadata:
      labels:
        app: access-api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: access-api
          image: access-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: REDIS_ADDR
              value: "redis:6379"
            - name: REDIS_SENTINEL_ADDRS
              valueFrom:
                configMapKeyRef:
                  name: access-control-config
                  key: REDIS_SENTINEL_ADDRS
            - name: REDIS_MASTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: access-control-config
                  key: REDIS_MASTER_NAME
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: access-control-secrets
                  key: REDIS_PASSWORD
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: access-control-config
                  key: KAFKA_BROKERS
            - name: KAFKA_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: access-control-config
                  key: KAFKA_TOPIC
            - name: PUBLISHER_ASYNC
              value: "true"
            - name: PUBLISHER_QUEUE_SIZE
              value: "50000"
            - name: PUBLISHER_WORKERS
              value: "8"
            - name: PUBLISHER_BATCH_SIZE
              value: "100"
            - name: PUBLISHER_FLUSH_MS
              value: "10"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
              ephemeral-storage: 1Gi
