          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: access-control-secrets
                  key: REDIS_PASSWORD
          command:
            - sh
            - -c
            - redis-server --replicaof redis 6379 --masterauth "$REDIS_PASSWORD" --requirepass "$REDIS_PASSWORD" --maxmemory 96mb --maxmemory-policy noeviction
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 150m
              memory: 128Mi
              ephemeral-storage: 512Mi
---
