apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: access-control
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: access-control
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: access-control-secrets
                  key: REDIS_PASSWORD
          command:
            - sh
            - -c
            - redis-server --appendonly yes --requirepass "$REDIS_PASSWORD" --maxmemory 192mb --maxmemory-policy noeviction
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 512Mi
            limits:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 1Gi
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: access-control
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-replica-1
  namespace: access-control
  labels:
    app: redis-replica-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-replica-1
  template:
    metadata:
      labels:
        app: redis-replica-1
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
