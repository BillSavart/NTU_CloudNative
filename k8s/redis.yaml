apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-sentinel-1
  namespace: access-control
  labels:
    app: redis-sentinel-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-sentinel-1
  template:
    metadata:
      labels:
        app: redis-sentinel-1
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis-sentinel
          image: redis:7-alpine
          ports:
            - name: sentinel
              containerPort: 26379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: access-control-secrets
                  key: REDIS_PASSWORD
          command:
            - sh
            - -c
            - cp /etc/redis/sentinel.conf /tmp/sentinel.conf && echo "sentinel auth-pass mymaster $REDIS_PASSWORD" >> /tmp/sentinel.conf && redis-server /tmp/sentinel.conf --sentinel
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 100m
              memory: 96Mi
              ephemeral-storage: 128Mi
          volumeMounts:
            - name: sentinel-config
              mountPath: /etc/redis
      volumes:
        - name: sentinel-config
          configMap:
            name: redis-sentinel-config
---
apiVersion: v1
kind: Service
metadata:
