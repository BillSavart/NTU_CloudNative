services:
  reporting-api:
    build:
      context: ./reporting-api
      args:
        INSTALL_OBSERVABILITY: "true"

  prometheus:
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=native-histograms"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    depends_on:
      - access-lb
      - reporting-api
      - redis-exporter
      - postgres-exporter
      - kafka-exporter

  grafana:
    volumes:
      - grafanadata:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    restart: on-failure
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "${REDIS_EXPORTER_HOST_PORT:-9121}:9121"
    depends_on:
      - redis

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    restart: on-failure
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      - "${POSTGRES_EXPORTER_HOST_PORT:-9187}:9187"
    depends_on:
      - db

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    restart: on-failure
    command:
      - "--kafka.server=kafka-1:9092"
      - "--kafka.server=kafka-2:9092"
      - "--kafka.server=kafka-3:9092"
    ports:
      - "${KAFKA_EXPORTER_HOST_PORT:-9308}:9308"
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3

  k6:
    image: grafana/k6:0.54.0
    profiles:
      - load-test
    environment:
      BASE_URL: http://reporting-api:8000
      LOGIN_ID: ${K6_LOGIN_ID:-rd_1_manager}
      LOGIN_PASSWORD: ${K6_LOGIN_PASSWORD:-demo123}
      VUS: ${K6_VUS:-20}
      RAMP_UP: ${K6_RAMP_UP:-30s}
      STEADY: ${K6_STEADY:-2m}
      RAMP_DOWN: ${K6_RAMP_DOWN:-30s}
      THINK_TIME_SECONDS: ${K6_THINK_TIME_SECONDS:-1}
      P95_THRESHOLD_MS: ${K6_P95_THRESHOLD_MS:-15000}
      TEST_ID: ${K6_TEST_ID:-reporting-api-demo}
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM: "true"
    command:
      - run
      - --out
      - experimental-prometheus-rw
      - /scripts/reporting-api.js
    volumes:
      - ./observability/k6:/scripts:ro
    depends_on:
      - prometheus
      - reporting-api
