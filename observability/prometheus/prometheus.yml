global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: access-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - access-lb:8080

  - job_name: reporting-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - reporting-api:8000

  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: kafka
    static_configs:
      - targets:
          - kafka-exporter:9308
