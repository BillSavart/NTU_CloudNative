sonar.projectKey=NTU-CloudNative
sonar.projectName=NTU CloudNative
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

sonar.sources=access-api,reporting-api/app,frontend/src,scripts,k8s,infra,observability
sonar.tests=reporting-api/tests

sonar.test.inclusions=reporting-api/tests/**/*.py,access-api/**/*_test.go,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/__pycache__/**,**/.pytest_cache/**,**/.venv/**,**/coverage/**,**/package-lock.json,**/go.sum,**/migrations/versions/**
sonar.coverage.exclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,reporting-api/tests/**,scripts/**,k8s/**,infra/**,observability/**
