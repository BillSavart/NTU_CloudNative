sonar.projectKey=NTU-CloudNative
sonar.projectName=NTU CloudNative
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

sonar.sources=access-api,reporting-api/app,frontend/src,scripts,infra
sonar.tests=reporting-api/tests

sonar.test.inclusions=reporting-api/tests/**/*.py,access-api/**/*_test.go,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/__pycache__/**,**/.pytest_cache/**,**/.venv/**,**/coverage/**,**/package-lock.json,**/go.sum,**/migrations/versions/**,**/Dockerfile,k8s/**,observability/**,access-api/cmd/**,reporting-api/app/config.py,reporting-api/app/fake_data.py,reporting-api/app/live_swipes.py,reporting-api/app/patch_fake_data.py,reporting-api/app/seed.py,frontend/src/assets/**
sonar.coverage.exclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,reporting-api/tests/**,scripts/**,k8s/**,infra/**,observability/**,access-api/main.go,access-api/observability.go,access-api/cmd/swipe-simulator/**,access-api/publisher.go,reporting-api/app/main.py,reporting-api/app/migrations.py,reporting-api/app/observability.py,reporting-api/app/fake_data.py,reporting-api/app/live_swipes.py,reporting-api/app/patch_fake_data.py,reporting-api/app/seed.py,reporting-api/app/repositories.py,reporting-api/app/consumers/**,reporting-api/app/routers/**,frontend/src/main.tsx,frontend/src/App.tsx,frontend/src/pages/**,frontend/src/components/layout/**,frontend/src/components/dashboard/**

sonar.go.coverage.reportPaths=access-api/coverage.out
sonar.python.coverage.reportPaths=reporting-api/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
